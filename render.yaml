services:
  - type: web
    name: uj-ai-cross-platform
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: uj-ai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/ujai.sqlite
      - key: PUBLIC_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: META_API_KEY
        sync: false
      - key: META_BASE_URL
        sync: false
      - key: META_MODEL
        sync: false
